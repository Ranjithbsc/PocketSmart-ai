
{% extends "base.html" %}
{% block title %}Create account · PocketSmart AI{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Create your account</h1>
  <p class="muted">Your recommendation history is stored locally in the application database.</p>
  <form action="/register/form" method="post" class="form">
    <label>Username<input name="username" required minlength="3" maxlength="50" autocomplete="username"></label>
    <label>Email<input name="email" type="email" required autocomplete="email"></label>
    <label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
    <label>Confirm password<input name="confirm_password" type="password" required minlength="8" autocomplete="new-password"></label>
    <button class="btn" type="submit">Create account</button>
  </form>
  <p>Already have an account? <a href="/login">Sign in</a></p>
</div>
{% endblock %}
